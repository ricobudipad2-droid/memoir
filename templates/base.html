<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}Memoir{% endblock %} — AI Journal</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
{% block head %}{% endblock %}</head><body>
<nav class="sidebar"><div class="logo"><span class="logo-icon">📔</span><span class="logo-text">Memoir</span></div>
<ul class="nav-links">
<li><a href="/" class="{{ 'active' if request.path == '/' else '' }}">✍️ Write</a></li>
<li><a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">📊 Dashboard</a></li>
<li><a href="/history" class="{{ 'active' if request.path == '/history' else '' }}">📚 History</a></li>
</ul>
<div class="sidebar-footer"><span class="version">v0.4.0</span><span class="mimo-badge">MiMo v2.5</span></div></nav>
<main class="content">{% block content %}{% endblock %}</main>
<script src="/static/js/app.js"></script>{% block scripts %}{% endblock %}</body></html>
